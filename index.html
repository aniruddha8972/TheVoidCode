<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>VOID Notebook</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.17/codemirror.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.17/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.17/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.17/mode/markdown/markdown.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.17/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.17/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.17/addon/edit/closebrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.17/addon/selection/active-line.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdn.jsdelivr.net/pyodide/v0.25.1/full/pyodide.js"></script>
<style>
:root{
  --bg0:#03070d;--bg1:#060d16;--bg2:#0a1420;--bg3:#0e1c2c;--bg4:#122438;
  --border:#0d2a3d;--border2:#082030;--border3:#1a3f5a;--border4:#1e4a66;
  --green:#00ff88;--green2:#00cc6a;--green3:#003d1f;--green4:#001f0f;
  --cyan:#00e5ff;--cyan2:#00b8cc;--cyan3:#003d4d;
  --amber:#ffb300;--red:#ff3366;--purple:#a855f7;--purple2:#7c3aed;
  --blue:#3b82f6;--pink:#ec4899;
  --dim:#1e3d50;--dim2:#162d3d;
  --text:#c8e8f8;--text2:#7ab8d0;--text3:#2d6a82;--text4:#153a4d;
  --glow-g:0 0 12px #00ff8866,0 0 32px #00ff8820;
  --glow-c:0 0 12px #00e5ff55,0 0 28px #00e5ff18;
  --font:'JetBrains Mono',monospace;
  --font-ui:'Inter',sans-serif;
  --font-display:'Orbitron',sans-serif;
  --cell-w:860px;
  --nb-bg:#050c14;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;}
body{background:var(--nb-bg);color:var(--text);font-family:var(--font);font-size:13px;display:flex;flex-direction:column;}

/* scanlines */
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:9999;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.04) 2px,rgba(0,0,0,0.04) 4px);}

/* ── TOPBAR ── */
#topbar{
  height:44px;background:var(--bg1);border-bottom:1px solid var(--border2);
  display:flex;align-items:center;padding:0 16px;gap:12px;flex-shrink:0;
  user-select:none;position:relative;z-index:100;
}
.wm-dots{display:flex;gap:6px;}
.wm-dots span{width:10px;height:10px;border-radius:50%;display:block;}
.wm-dots span:nth-child(1){background:#ff5f57;}
.wm-dots span:nth-child(2){background:#febc2e;}
.wm-dots span:nth-child(3){background:#28c840;}
#nb-title{
  font-family:var(--font-display);font-size:12px;font-weight:900;
  color:var(--green);text-shadow:var(--glow-g);letter-spacing:6px;
  position:absolute;left:50%;transform:translateX(-50%);
}
#nb-title em{color:var(--cyan);font-style:normal;}
#nb-title small{font-family:var(--font);font-size:9px;color:var(--dim);letter-spacing:2px;font-weight:400;}
#kernel-pill{
  margin-left:auto;display:flex;align-items:center;gap:7px;
  padding:3px 12px;background:var(--bg3);border:1px solid var(--border);
  border-radius:20px;font-size:9px;letter-spacing:2px;color:var(--text3);
  font-family:var(--font);
}
#kernel-dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:var(--glow-g);animation:blink 2s infinite;}
#kernel-dot.busy{background:var(--amber);animation:pulse-a 0.8s infinite;box-shadow:0 0 8px #ffb30099;}
#kernel-dot.dead{background:var(--red);animation:none;}
@keyframes blink{50%{opacity:.15;}}
@keyframes pulse-a{0%,100%{transform:scale(1);}50%{transform:scale(1.3);}}
#sys-clock{font-size:9px;color:var(--text3);letter-spacing:2px;}

/* ── MENUBAR ── */
#menubar{
  height:32px;background:var(--bg1);border-bottom:1px solid var(--border2);
  display:flex;align-items:center;padding:0 12px;gap:2px;flex-shrink:0;
}
.menu-group{display:flex;gap:2px;align-items:center;}
.mb-btn{
  padding:3px 10px;font-family:var(--font);font-size:10px;letter-spacing:1px;
  text-transform:uppercase;color:var(--text3);cursor:pointer;border-radius:2px;
  background:none;border:none;transition:all .12s;
}
.mb-btn:hover{color:var(--green);background:var(--green4);}
.mb-btn.run-all{
  color:var(--green);border:1px solid var(--green);background:var(--green4);
  box-shadow:var(--glow-g);
}
.mb-btn.run-all:hover{background:var(--green3);}
.mb-sep{width:1px;height:16px;background:var(--border);margin:0 4px;}
#nb-name-input{
  background:none;border:none;color:var(--cyan2);font-family:var(--font);
  font-size:11px;outline:none;width:200px;border-bottom:1px solid transparent;
  transition:border-color .2s;
}
#nb-name-input:focus{border-bottom-color:var(--cyan2);}
.lang-badge{
  padding:2px 8px;border:1px solid var(--border3);border-radius:10px;
  font-size:9px;color:var(--cyan2);letter-spacing:1px;margin-right:4px;cursor:pointer;
  transition:all .12s;
}
.lang-badge:hover{border-color:var(--cyan);color:var(--cyan);}
.lang-badge.active{border-color:var(--green);color:var(--green);background:var(--green4);}

/* ── MAIN LAYOUT ── */
#main{display:flex;flex:1;overflow:hidden;min-height:0;}

/* ── LEFT PANEL ── */
#left-panel{
  width:220px;flex-shrink:0;background:var(--bg1);
  border-right:1px solid var(--border2);
  display:flex;flex-direction:column;overflow:hidden;
}
.panel-head{
  padding:7px 12px;font-size:8px;letter-spacing:3px;text-transform:uppercase;
  color:var(--text3);border-bottom:1px solid var(--border2);
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0;
}
.panel-head button{
  background:none;border:none;color:var(--green);cursor:pointer;
  font-size:15px;line-height:1;opacity:.7;transition:opacity .12s;
}
.panel-head button:hover{opacity:1;}

/* cell outline */
#cell-outline{flex:1;overflow-y:auto;padding:4px 0;}
.outline-item{
  display:flex;align-items:center;gap:6px;padding:5px 12px;
  cursor:pointer;font-size:10px;color:var(--text3);
  border-left:2px solid transparent;transition:all .1s;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.outline-item:hover{background:var(--bg3);color:var(--text2);}
.outline-item.active{color:var(--cyan2);border-left-color:var(--cyan2);background:var(--bg3);}
.outline-item .cell-num{color:var(--text4);font-size:9px;flex-shrink:0;}
.outline-item .cell-preview{overflow:hidden;text-overflow:ellipsis;}

/* packages */
.sb-section{border-top:1px solid var(--border2);padding:10px 12px;flex-shrink:0;}
.sec-label{font-size:8px;letter-spacing:3px;text-transform:uppercase;color:var(--text3);margin-bottom:7px;}
.pkg-row{display:flex;gap:4px;}
#pkg-input{flex:1;padding:5px 8px;background:var(--bg0);border:1px solid var(--border);border-radius:3px;color:var(--green);font-family:var(--font);font-size:11px;outline:none;}
#pkg-input:focus{border-color:var(--green);}
#pkg-input::placeholder{color:var(--dim);}
#pkg-btn{padding:5px 9px;background:var(--green4);border:1px solid var(--green);border-radius:3px;color:var(--green);font-family:var(--font);font-size:13px;cursor:pointer;}
#pkg-btn:hover{background:var(--green3);}
#pkg-tags{margin-top:6px;max-height:60px;overflow-y:auto;}
.pkg-tag{display:inline-block;padding:1px 7px;margin:2px 2px 0 0;background:var(--bg4);border:1px solid var(--border3);border-radius:10px;color:var(--cyan2);font-size:9px;}

/* drive section */
#drive-clientid-input{width:100%;padding:4px 8px;background:var(--bg0);border:1px solid var(--border);border-radius:3px;color:var(--amber);font-family:var(--font);font-size:10px;outline:none;margin-bottom:4px;}
#drive-clientid-input:focus{border-color:var(--amber);}
#drive-clientid-input::placeholder{color:var(--dim);font-size:9px;}
#drive-set-btn{width:100%;padding:4px;background:none;border:1px solid var(--amber);border-radius:3px;color:var(--amber);font-family:var(--font);font-size:9px;cursor:pointer;letter-spacing:1px;text-transform:uppercase;}
#drive-set-btn:hover{background:rgba(255,179,0,.1);}
#drive-help{font-size:9px;color:var(--text3);line-height:1.6;margin-top:4px;}
#drive-help a{color:var(--cyan2);text-decoration:none;}
#drive-auth-area{display:none;}
#drive-signin-btn{width:100%;padding:5px;background:none;border:1px solid var(--border3);border-radius:3px;color:var(--text2);font-family:var(--font);font-size:10px;cursor:pointer;margin-bottom:5px;transition:all .12s;}
#drive-signin-btn:hover{border-color:var(--cyan);color:var(--cyan);}
#drive-signin-btn.ok{border-color:var(--green);color:var(--green);background:var(--green4);}
.drive-btns{display:flex;gap:3px;flex-wrap:wrap;}
.drive-btn{flex:1;min-width:calc(50% - 4px);padding:4px 3px;background:none;border:1px solid var(--border);border-radius:3px;color:var(--text2);font-family:var(--font);font-size:9px;letter-spacing:.3px;text-transform:uppercase;cursor:pointer;transition:all .12s;text-align:center;}
.drive-btn:hover:not(:disabled){border-color:var(--cyan);color:var(--cyan);background:var(--cyan3);}
.drive-btn:disabled{opacity:.3;cursor:not-allowed;}
#drive-folder-info{font-size:9px;color:var(--text3);margin-top:5px;}
#drive-folder-info span{color:var(--cyan2);}
#drive-tree{max-height:80px;overflow-y:auto;margin-top:5px;}
.drive-file{display:flex;align-items:center;gap:5px;padding:3px 4px;font-size:10px;color:var(--text2);cursor:pointer;border-radius:2px;}
.drive-file:hover{background:var(--bg3);color:var(--text);}
.df-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#env-info{border-top:1px solid var(--border2);padding:8px 12px;font-size:9px;color:var(--text3);}
.env-row{display:flex;justify-content:space-between;margin-bottom:3px;}
.env-val{color:var(--cyan2);}

/* ── NOTEBOOK CANVAS ── */
#notebook-canvas{
  flex:1;overflow-y:auto;overflow-x:hidden;
  background:var(--nb-bg);padding:24px 0 120px;
  display:flex;flex-direction:column;align-items:center;
  scroll-behavior:smooth;
}
#notebook-canvas::-webkit-scrollbar{width:6px;}
#notebook-canvas::-webkit-scrollbar-thumb{background:var(--border3);border-radius:3px;}

/* ── CELL ── */
.cell{
  width:var(--cell-w);max-width:96%;
  display:flex;flex-direction:column;
  margin-bottom:6px;position:relative;
  border-radius:6px;transition:all .15s;
}
.cell::before{
  content:'';position:absolute;left:-16px;top:0;bottom:0;
  width:3px;border-radius:2px;background:transparent;transition:background .15s;
}
.cell.selected::before{background:var(--cyan2);}
.cell.running::before{background:var(--amber);animation:pulse-left 0.8s infinite;}
@keyframes pulse-left{0%,100%{opacity:1;}50%{opacity:.3;}}

/* cell header */
.cell-header{
  display:flex;align-items:center;gap:8px;
  padding:5px 10px 4px;opacity:0;transition:opacity .15s;
}
.cell:hover .cell-header,.cell.selected .cell-header{opacity:1;}
.cell-type-badge{
  font-size:8px;letter-spacing:2px;text-transform:uppercase;
  padding:1px 7px;border-radius:10px;border:1px solid;
}
.cell-type-badge.code{color:var(--cyan2);border-color:var(--cyan3);}
.cell-type-badge.markdown{color:var(--purple);border-color:rgba(168,85,247,.3);}
.cell-type-badge.raw{color:var(--text3);border-color:var(--border);}
.cell-num{font-size:9px;color:var(--text4);min-width:20px;}

.cell-actions{display:flex;gap:3px;margin-left:auto;}
.cell-act-btn{
  padding:2px 7px;background:none;border:1px solid var(--border);
  border-radius:2px;color:var(--text3);font-family:var(--font);
  font-size:9px;cursor:pointer;transition:all .12s;letter-spacing:.5px;
}
.cell-act-btn:hover{color:var(--text);border-color:var(--border3);}
.cell-act-btn.run-cell{border-color:var(--green2);color:var(--green2);}
.cell-act-btn.run-cell:hover{background:var(--green4);}
.cell-act-btn.del-cell{border-color:var(--red);color:var(--red);}
.cell-act-btn.del-cell:hover{background:rgba(255,51,102,.1);}

/* cell body */
.cell-body{
  background:var(--bg1);border:1px solid var(--border2);
  border-radius:6px;overflow:hidden;transition:border-color .15s;
}
.cell.selected .cell-body{border-color:var(--border4);}
.cell.running .cell-body{border-color:var(--amber);}

/* input area */
.cell-input{display:flex;align-items:stretch;}
.cell-gutter{
  width:46px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--border2);
  display:flex;align-items:flex-start;justify-content:center;
  padding-top:10px;font-size:10px;color:var(--text4);
  font-family:var(--font);letter-spacing:.5px;flex-direction:column;
  align-items:center;gap:2px;
}
.exec-count{font-size:10px;color:var(--text4);}
.exec-count.ran{color:var(--cyan2);}
.exec-count.busy{color:var(--amber);}

/* CodeMirror inside cell */
.cell-editor-wrap{flex:1;min-height:36px;cursor:text;}
.CodeMirror{
  height:auto!important;min-height:36px;
  background:var(--bg1)!important;color:var(--text)!important;
  font-family:var(--font)!important;font-size:13px!important;
  line-height:1.7!important;border:none!important;
}
.CodeMirror-scroll{padding:8px 0;}
.CodeMirror-lines{padding:0 14px!important;}
.CodeMirror-gutters{background:transparent!important;border:none!important;width:0!important;min-width:0!important;}
.CodeMirror-linenumber{display:none!important;}
.CodeMirror-cursor{border-left:2px solid var(--green)!important;}
.CodeMirror-selected{background:#00e5ff14!important;}
.CodeMirror-activeline-background{background:#0a1420!important;}
.CodeMirror-matchingbracket{color:var(--green)!important;outline:1px solid #00ff8844;}

/* syntax colors */
.cm-keyword{color:#ff79c6!important;font-weight:500;}
.cm-builtin{color:#8be9fd!important;}
.cm-def{color:#82cfff!important;}
.cm-variable-2{color:#9cdcfe!important;}
.cm-variable-3,.cm-type{color:#4ec9b0!important;}
.cm-string,.cm-string-2{color:#f1fa8c!important;}
.cm-number{color:#bd93f9!important;}
.cm-comment{color:#3a7a8a!important;font-style:italic;}
.cm-operator{color:#ff79c6!important;}
.cm-atom{color:#bd93f9!important;}
.cm-property{color:#9cdcfe!important;}
.cm-meta{color:var(--amber)!important;}
.cm-header{color:var(--green)!important;font-weight:bold;}
.cm-strong{font-weight:bold;}
.cm-em{font-style:italic;}
.cm-link{color:var(--cyan2)!important;text-decoration:underline;}

/* output area */
.cell-output{
  border-top:1px solid var(--border2);
  background:var(--bg0);
  overflow:hidden;
}
.cell-output.empty{display:none;}
.output-toolbar{
  display:flex;align-items:center;padding:3px 10px;
  background:var(--bg2);border-bottom:1px solid var(--border2);
  gap:8px;font-size:9px;color:var(--text4);
}
.output-toolbar button{
  background:none;border:none;color:var(--text4);cursor:pointer;
  font-size:10px;transition:color .12s;padding:0 2px;
}
.output-toolbar button:hover{color:var(--red);}
.output-lines{padding:8px 14px;font-size:12px;line-height:1.65;max-height:400px;overflow-y:auto;}
.output-lines::-webkit-scrollbar{width:3px;}
.output-lines::-webkit-scrollbar-thumb{background:var(--border3);}
.out-stdout{color:#c8e8f0;}
.out-stderr{color:var(--red);}
.out-result{color:#bd93f9;border-left:2px solid rgba(189,147,249,.3);padding-left:8px;margin-top:4px;}
.out-error{color:var(--red);background:rgba(255,51,102,.06);padding:6px 10px;border-radius:3px;border-left:2px solid var(--red);}
.out-info{color:var(--cyan2);font-style:italic;}
.out-warn{color:var(--amber);}
.out-html{padding:4px 0;}
.out-html table{border-collapse:collapse;font-size:11px;margin:4px 0;}
.out-html th{background:var(--bg3);color:var(--cyan2);padding:4px 10px;border:1px solid var(--border3);text-align:left;font-size:10px;letter-spacing:1px;}
.out-html td{padding:3px 10px;border:1px solid var(--border);color:var(--text);}
.out-html tr:nth-child(even) td{background:var(--bg2);}

/* markdown rendered */
.cell-md-render{
  padding:12px 18px;font-family:var(--font-ui);font-size:14px;
  line-height:1.8;color:var(--text);cursor:pointer;
  background:var(--bg1);
}
.cell-md-render h1{font-size:22px;color:var(--green);margin-bottom:10px;font-family:var(--font);letter-spacing:2px;border-bottom:1px solid var(--border3);padding-bottom:8px;}
.cell-md-render h2{font-size:18px;color:var(--cyan2);margin:14px 0 8px;font-family:var(--font);}
.cell-md-render h3{font-size:15px;color:var(--purple);margin:12px 0 6px;font-family:var(--font);}
.cell-md-render p{margin-bottom:10px;color:var(--text2);}
.cell-md-render code{background:var(--bg3);color:var(--amber);padding:1px 6px;border-radius:3px;font-family:var(--font);font-size:12px;}
.cell-md-render pre{background:var(--bg0);border:1px solid var(--border);padding:12px;border-radius:4px;overflow-x:auto;margin:8px 0;}
.cell-md-render pre code{background:none;padding:0;color:var(--text);}
.cell-md-render ul,ol{padding-left:20px;margin-bottom:8px;color:var(--text2);}
.cell-md-render li{margin-bottom:3px;}
.cell-md-render strong{color:var(--text);font-weight:600;}
.cell-md-render em{color:var(--cyan2);font-style:italic;}
.cell-md-render blockquote{border-left:3px solid var(--cyan2);padding-left:12px;color:var(--text3);margin:8px 0;}
.cell-md-render a{color:var(--cyan2);}
.cell-md-render hr{border:none;border-top:1px solid var(--border3);margin:12px 0;}

/* add cell button */
.add-cell-bar{
  width:var(--cell-w);max-width:96%;
  display:flex;align-items:center;gap:8px;
  padding:4px 0;opacity:0;transition:opacity .2s;
}
.add-cell-bar:hover{opacity:1!important;}
.cell:hover + .add-cell-bar,.add-cell-bar:hover{opacity:1;}
#notebook-canvas > .add-cell-bar:last-child{opacity:.4;}
.add-line{flex:1;height:1px;background:var(--border);}
.add-cell-btn{
  padding:2px 12px;background:var(--bg2);border:1px solid var(--border3);
  border-radius:10px;color:var(--text3);font-family:var(--font);
  font-size:9px;letter-spacing:1px;cursor:pointer;white-space:nowrap;
  transition:all .12s;text-transform:uppercase;
}
.add-cell-btn:hover{border-color:var(--green);color:var(--green);background:var(--green4);}

/* ── BOOT ── */
#boot-screen{
  position:fixed;inset:0;background:var(--bg0);z-index:5000;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
}
#boot-logo{font-family:var(--font-display);font-size:44px;font-weight:900;color:var(--green);text-shadow:var(--glow-g);letter-spacing:12px;}
#boot-logo em{color:var(--cyan);font-style:normal;text-shadow:var(--glow-c);}
.boot-sub{font-size:10px;letter-spacing:4px;color:var(--text3);text-transform:uppercase;}
.boot-bar-wrap{width:320px;height:2px;background:var(--bg3);overflow:hidden;border-radius:1px;}
.boot-bar{height:100%;width:0%;background:linear-gradient(90deg,var(--green),var(--cyan));transition:width .3s;box-shadow:var(--glow-g);}
#boot-msg{font-size:10px;color:var(--dim);letter-spacing:2px;}

/* ── TOAST ── */
#toast{position:fixed;bottom:20px;right:20px;z-index:9999;padding:10px 16px;background:var(--bg3);border:1px solid var(--border3);border-left:3px solid var(--green);border-radius:4px;font-size:11px;color:var(--text);opacity:0;transform:translateY(8px);transition:all .22s;pointer-events:none;max-width:300px;font-family:var(--font);}
#toast.show{opacity:1;transform:translateY(0);}
#toast.err{border-left-color:var(--red);}
#toast.warn{border-left-color:var(--amber);}

::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:var(--bg0);}

<body>

        </div>

      <div class="env-row"><span>Python</span><span class="env-val" id="py-ver">—</span></div>
      <div class="env-row"><span>Backend</span><span class="env-val">WASM</span></div>

  </div>

  <!-- NOTEBOOK CANVAS -->

<script>
// ═══════════════════════════════════════════════════════
//  NOTEBOOK STATE
// ═══════════════════════════════════════════════════════
let pyodide = null;
let kernelBusy = false;
let kernelReady = false;
let cells = [];       // array of cell objects
let selectedCellId = null;
let execCounter = 0;
let installedPkgs = [];

// ── Cell factory ──────────────────────────────────────
function makeCell(type='code', source='') {
  return {
    id: 'c' + Date.now() + Math.random().toString(36).slice(2,6),
    type,        // 'code' | 'markdown' | 'raw'
    source,
    outputs: [],
    execCount: null,
    cm: null,    // CodeMirror instance
  };
}

// ═══════════════════════════════════════════════════════
//  BOOT / KERNEL
// ═══════════════════════════════════════════════════════
function setKernel(state, text) {
  const dot = document.getElementById('kernel-dot');
  dot.className = state;
  document.getElementById('kernel-status').textContent = text;
}
function setBootProgress(msg, pct) {
  document.getElementById('boot-msg').textContent = msg;
  document.getElementById('boot-bar').style.width = pct + '%';
}

async function bootKernel() {
  setBootProgress('LOADING PYTHON RUNTIME...', 15);
  try {
    pyodide = await loadPyodide();
    setBootProgress('PATCHING I/O...', 55);
    await pyodide.runPythonAsync(`
import sys, io, traceback as _tb
class _CB(io.TextIOBase):
    def __init__(self,fn): self._fn=fn; self._buf=""
    def write(self,s):
        self._buf+=s
        while '\\n' in self._buf:
            line,self._buf=self._buf.split('\\n',1); self._fn(line)
        return len(s)
    def flush(self): pass
import js
sys.stdout=_CB(lambda l: js._nbOut(l,"stdout"))
sys.stderr=_CB(lambda l: js._nbOut(l,"stderr"))
    `);
    setBootProgress('MICROPIP...', 80);
    await pyodide.loadPackage('micropip');
    const ver = pyodide.runPython('import sys; ".".join(map(str,sys.version_info[:3]))');
    document.getElementById('py-ver').textContent = ver;
    setBootProgress('READY', 100);
    kernelReady = true;
    setTimeout(() => {
      document.getElementById('boot-screen').style.display = 'none';
      setKernel('', 'IDLE');
      showToast('Kernel ready — Python ' + ver);
    }, 300);
  } catch(e) {
    setBootProgress('KERNEL FAILED: ' + e.message, 100);
    setKernel('dead', 'DEAD');
  }
}

async function restartKernel() {
  if (!confirm('Restart kernel? All variables will be lost.')) return;
  setKernel('busy', 'RESTARTING');
  cells.forEach(c => { c.execCount = null; c.outputs = []; renderCellOutput(c); updateExecCount(c); });
  execCounter = 0;
  await bootKernel();
  showToast('Kernel restarted');
}

function interruptKernel() {
  kernelBusy = false;
  setKernel('', 'IDLE');
  showToast('Interrupted', 'warn');
}

// Output stream bridge
let _currentRunCell = null;
window._nbOut = function(line, stream) {
  if (!_currentRunCell) return;
  const cell = cells.find(c => c.id === _currentRunCell);
  if (!cell) return;
  cell.outputs.push({type: stream, text: line});
  renderCellOutput(cell);
};

// ═══════════════════════════════════════════════════════
//  CELL RENDERING
// ═══════════════════════════════════════════════════════
function renderNotebook() {
  const canvas = document.getElementById('notebook-canvas');
  canvas.innerHTML = '';
  cells.forEach((cell, idx) => {
    canvas.appendChild(makeCellEl(cell, idx));
    canvas.appendChild(makeAddBar(idx + 1));
  });
  updateOutline();
}

function makeCellEl(cell, idx) {
  const wrap = document.createElement('div');
  wrap.className = 'cell' + (cell.id === selectedCellId ? ' selected' : '');
  wrap.dataset.id = cell.id;
  wrap.onclick = (e) => { if (!e.target.closest('button')) selectCell(cell.id); };

  const typeBadge = cell.type === 'code' ? 'code' : cell.type === 'markdown' ? 'markdown' : 'raw';
  const typeLabel = cell.type.charAt(0).toUpperCase() + cell.type.slice(1);

  wrap.innerHTML = `
    <div class="cell-header">
      <span class="cell-type-badge ${typeBadge}">${typeLabel}</span>
      <span class="cell-num">[${idx+1}]</span>
      <div class="cell-actions">
        ${cell.type === 'code' ? `<button class="cell-act-btn run-cell" onclick="runCell('${cell.id}')">▶ Run</button>` : ''}
        <button class="cell-act-btn" onclick="moveCellUp('${cell.id}')">↑</button>
        <button class="cell-act-btn" onclick="moveCellDown('${cell.id}')">↓</button>
        <button class="cell-act-btn" onclick="convertCell('${cell.id}')">⇄ ${cell.type==='code'?'MD':'Code'}</button>
        <button class="cell-act-btn del-cell" onclick="deleteCell('${cell.id}')">✕</button>
      </div>
    </div>
    <div class="cell-body">
      <div class="cell-input">
        <div class="cell-gutter">
          <div class="exec-count${cell.execCount?' ran':''}" id="ec_${cell.id}">
            ${cell.type==='code' ? (cell.execCount ? '['+cell.execCount+']' : '[ ]') : ''}
          </div>
        </div>
        <div class="cell-editor-wrap" id="ew_${cell.id}"></div>
      </div>
      ${cell.type==='markdown' ? `<div class="cell-md-render" id="md_${cell.id}" style="display:none;" ondblclick="editMarkdown('${cell.id}')"></div>` : ''}
      <div class="cell-output${cell.outputs.length?'':' empty'}" id="out_${cell.id}">
        <div class="output-toolbar">
          <span style="color:var(--text3);font-size:9px;letter-spacing:1px;">OUTPUT</span>
          <button onclick="clearCellOutput('${cell.id}')" title="Clear">✕</button>
        </div>
        <div class="output-lines" id="outlines_${cell.id}"></div>
      </div>
    </div>`;

  // Mount CodeMirror after DOM insertion
  requestAnimationFrame(() => {
    const ewEl = document.getElementById('ew_' + cell.id);
    if (!ewEl || cell.cm) return;

    const mode = cell.type === 'code' ? 'python' : cell.type === 'markdown' ? 'markdown' : null;
    const cm = CodeMirror(ewEl, {
      value: cell.source,
      mode: mode,
      lineNumbers: false,
      matchBrackets: true,
      autoCloseBrackets: true,
      styleActiveLine: true,
      indentUnit: 4,
      tabSize: 4,
      viewportMargin: Infinity,
      extraKeys: {
        'Ctrl-Enter': () => runCell(cell.id),
        'Cmd-Enter':  () => runCell(cell.id),
        'Shift-Enter':() => { runCell(cell.id); addCellAfter(cell.id, 'code'); },
        'Tab': (c) => {
          if (c.somethingSelected()) c.indentSelection('add');
          else c.replaceSelection('    ');
        },
        'Shift-Tab': (c) => c.indentSelection('subtract'),
      }
    });
    cm.on('change', () => { cell.source = cm.getValue(); updateOutline(); });
    cm.on('focus',  () => selectCell(cell.id));
    cell.cm = cm;

    // If markdown cell has content and it's not being edited, show rendered
    if (cell.type === 'markdown' && cell.source.trim()) {
      renderMarkdown(cell);
    }

    // Render existing outputs
    if (cell.outputs.length) renderCellOutput(cell);
  });

  return wrap;
}

function makeAddBar(afterIdx) {
  const bar = document.createElement('div');
  bar.className = 'add-cell-bar';
  bar.innerHTML = `<div class="add-line"></div>
    <button class="add-cell-btn" onclick="addCell('code',${afterIdx})">+ Code</button>
    <button class="add-cell-btn" onclick="addCell('markdown',${afterIdx})" style="border-color:rgba(168,85,247,.4);color:var(--purple);">+ MD</button>
    <div class="add-line"></div>`;
  return bar;
}

function renderCellOutput(cell) {
  const outEl = document.getElementById('out_' + cell.id);
  const linesEl = document.getElementById('outlines_' + cell.id);
  if (!outEl || !linesEl) return;

  if (!cell.outputs.length) {
    outEl.classList.add('empty');
    linesEl.innerHTML = '';
    return;
  }
  outEl.classList.remove('empty');
  linesEl.innerHTML = '';
  cell.outputs.forEach(o => {
    const d = document.createElement('div');
    if (o.type === 'stdout')  { d.className='out-stdout'; d.textContent = o.text; }
    else if (o.type==='stderr'){ d.className='out-stderr'; d.textContent = o.text; }
    else if (o.type==='result'){ d.className='out-result'; d.textContent = o.text; }
    else if (o.type==='error') { d.className='out-error';  d.textContent = o.text; }
    else if (o.type==='html')  { d.className='out-html';   d.innerHTML = o.text; }
    else if (o.type==='info')  { d.className='out-info';   d.textContent = o.text; }
    else if (o.type==='warn')  { d.className='out-warn';   d.textContent = o.text; }
    linesEl.appendChild(d);
  });
  linesEl.scrollTop = linesEl.scrollHeight;
}

function updateExecCount(cell) {
  const el = document.getElementById('ec_' + cell.id);
  if (!el || cell.type !== 'code') return;
  el.textContent = cell.execCount ? '['+cell.execCount+']' : '[ ]';
  el.className = 'exec-count' + (cell.execCount ? ' ran' : '');
}

function renderMarkdown(cell) {
  const mdEl = document.getElementById('md_' + cell.id);
  const ewEl = document.getElementById('ew_' + cell.id);
  if (!mdEl || !ewEl) return;
  const html = typeof marked !== 'undefined' ? marked.parse(cell.source) : cell.source;
  mdEl.innerHTML = html;
  mdEl.style.display = 'block';
  ewEl.style.display = 'none';
}

function editMarkdown(id) {
  const cell = cells.find(c => c.id === id);
  if (!cell || cell.type !== 'markdown') return;
  const mdEl = document.getElementById('md_' + id);
  const ewEl = document.getElementById('ew_' + id);
  mdEl.style.display = 'none';
  ewEl.style.display = '';
  setTimeout(() => cell.cm && cell.cm.focus(), 50);
}

// ═══════════════════════════════════════════════════════
//  CELL OPERATIONS
// ═══════════════════════════════════════════════════════
function selectCell(id) {
  selectedCellId = id;
  document.querySelectorAll('.cell').forEach(el => {
    el.classList.toggle('selected', el.dataset.id === id);
  });
}

function addCell(type='code', afterIdx=null) {
  const cell = makeCell(type, type==='markdown' ? '## New Markdown Cell\n\nDouble-click to edit.' : '');
  if (afterIdx === null || afterIdx >= cells.length) {
    cells.push(cell);
  } else {
    cells.splice(afterIdx, 0, cell);
  }
  renderNotebook();
  selectCell(cell.id);
  setTimeout(() => {
    if (cell.cm) cell.cm.focus();
    const el = document.querySelector(`[data-id="${cell.id}"]`);
    if (el) el.scrollIntoView({behavior:'smooth', block:'nearest'});
  }, 60);
}

function addCellAfter(id, type='code') {
  const idx = cells.findIndex(c => c.id === id);
  addCell(type, idx + 1);
}

function deleteCell(id) {
  if (cells.length <= 1) return;
  const idx = cells.findIndex(c => c.id === id);
  cells.splice(idx, 1);
  if (selectedCellId === id) selectedCellId = cells[Math.min(idx, cells.length-1)]?.id;
  renderNotebook();
}

function moveCellUp(id) {
  const idx = cells.findIndex(c => c.id === id);
  if (idx <= 0) return;
  [cells[idx-1], cells[idx]] = [cells[idx], cells[idx-1]];
  renderNotebook(); selectCell(id);
}

function moveCellDown(id) {
  const idx = cells.findIndex(c => c.id === id);
  if (idx >= cells.length-1) return;
  [cells[idx], cells[idx+1]] = [cells[idx+1], cells[idx]];
  renderNotebook(); selectCell(id);
}

function convertCell(id) {
  const cell = cells.find(c => c.id === id);
  if (!cell) return;
  if (cell.cm) cell.source = cell.cm.getValue();
  cell.type = cell.type === 'code' ? 'markdown' : 'code';
  cell.outputs = []; cell.execCount = null; cell.cm = null;
  renderNotebook(); selectCell(id);
}

function clearCellOutput(id) {
  const cell = cells.find(c => c.id === id);
  if (!cell) return;
  cell.outputs = [];
  renderCellOutput(cell);
}

function clearAllOutputs() {
  cells.forEach(c => { c.outputs = []; renderCellOutput(c); });
  showToast('All outputs cleared');
}

function updateOutline() {
  const el = document.getElementById('cell-outline');
  if (!el) return;
  el.innerHTML = '';
  cells.forEach((cell, idx) => {
    const d = document.createElement('div');
    d.className = 'outline-item' + (cell.id === selectedCellId ? ' active' : '');
    d.onclick = () => {
      selectCell(cell.id);
      document.querySelector(`[data-id="${cell.id}"]`)?.scrollIntoView({behavior:'smooth', block:'center'});
    };
    const preview = cell.source.split('\n')[0].replace(/^#+\s*/, '').slice(0, 28) || '...';
    const icon = cell.type === 'code' ? '⌥' : cell.type === 'markdown' ? '¶' : '—';
    d.innerHTML = `<span style="color:var(--text4);font-size:10px;">${icon}</span>
      <span class="cell-num">[${idx+1}]</span>
      <span class="cell-preview">${preview}</span>`;
    el.appendChild(d);
  });
}

// ═══════════════════════════════════════════════════════
//  CODE EXECUTION
// ═══════════════════════════════════════════════════════
async function runCell(id) {
  if (!kernelReady) { showToast('Kernel not ready', 'warn'); return; }
  if (kernelBusy)   { showToast('Kernel busy — wait or interrupt', 'warn'); return; }

  const cell = cells.find(c => c.id === id);
  if (!cell || cell.type !== 'code') {
    // For markdown — render it
    if (cell?.type === 'markdown') {
      if (cell.cm) cell.source = cell.cm.getValue();
      renderMarkdown(cell);
    }
    return;
  }

  if (cell.cm) cell.source = cell.cm.getValue();
  if (!cell.source.trim()) return;

  // Mark running
  kernelBusy = true;
  _currentRunCell = id;
  cell.outputs = [];
  renderCellOutput(cell);
  const cellEl = document.querySelector(`[data-id="${id}"]`);
  cellEl?.classList.add('running');
  const ecEl = document.getElementById('ec_' + id);
  if (ecEl) { ecEl.textContent = '[*]'; ecEl.className = 'exec-count busy'; }
  setKernel('busy', 'BUSY');

  try {
    const result = await pyodide.runPythonAsync(cell.source);
    // If there's a non-None result, show it
    if (result !== undefined && result !== null) {
      const repr = pyodide.runPython(`repr(${JSON.stringify(result)})`).catch?.() ?? String(result);
      cell.outputs.push({type:'result', text: String(result)});
    }
  } catch(e) {
    cell.outputs.push({type:'error', text: String(e)});
  }

  execCounter++;
  cell.execCount = execCounter;
  kernelBusy = false;
  _currentRunCell = null;
  cellEl?.classList.remove('running');
  updateExecCount(cell);
  renderCellOutput(cell);
  setKernel('', 'IDLE');
  updateOutline();
}

function runSelectedCell() {
  if (selectedCellId) runCell(selectedCellId);
}

async function runAll() {
  for (const cell of cells) {
    if (cell.type === 'code' && cell.source.trim()) {
      await runCell(cell.id);
    } else if (cell.type === 'markdown') {
      if (cell.cm) cell.source = cell.cm.getValue();
      renderMarkdown(cell);
    }
    await new Promise(r => setTimeout(r, 50));
  }
  showToast('All cells executed');
}

// ═══════════════════════════════════════════════════════
//  PACKAGES
// ═══════════════════════════════════════════════════════
async function installPackage() {
  const inp = document.getElementById('pkg-input');
  const pkg = inp.value.trim();
  if (!pkg || !pyodide) return;
  inp.value = '';
  // Add an info cell or just log
  addOutputToSelected(`Installing ${pkg}…`, 'info');
  setKernel('busy', 'INSTALLING');
  try {
    const safe = pkg.replace(/['"\\]/g,'');
    await pyodide.runPythonAsync(`import micropip; await micropip.install("${safe}")`);
    installedPkgs.push(pkg);
    document.getElementById('pkg-tags').innerHTML =
      installedPkgs.map(p=>`<span class="pkg-tag">${p}</span>`).join('');
    addOutputToSelected(`✓ Installed: ${pkg}`, 'info');
    showToast('✓ ' + pkg + ' installed');
    setKernel('', 'IDLE');
  } catch(e) {
    addOutputToSelected('Failed: ' + e.message, 'stderr');
    showToast('Install failed: ' + pkg, 'err');
    setKernel('', 'IDLE');
  }
}

function addOutputToSelected(text, type='stdout') {
  const cell = selectedCellId ? cells.find(c=>c.id===selectedCellId) : cells[cells.length-1];
  if (!cell) return;
  cell.outputs.push({type, text});
  renderCellOutput(cell);
}

// ═══════════════════════════════════════════════════════
//  EXPORT
// ═══════════════════════════════════════════════════════
function exportNotebook() {
  // Export as .ipynb format
  const nb = {
    nbformat: 4, nbformat_minor: 5,
    metadata: { kernelspec: {display_name:'Python 3', language:'python', name:'python3'}, language_info:{name:'python'} },
    cells: cells.map(cell => ({
      cell_type: cell.type === 'markdown' ? 'markdown' : 'code',
      source: cell.source,
      metadata: {},
      outputs: cell.outputs.map(o => ({
        output_type: o.type === 'result' ? 'execute_result' : 'stream',
        text: o.text,
        name: o.type === 'stderr' ? 'stderr' : 'stdout',
      })),
      execution_count: cell.execCount || null,
    }))
  };
  const blob = new Blob([JSON.stringify(nb, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (document.getElementById('nb-name-input').value || 'notebook') + '.ipynb';
  a.click();
  showToast('Exported as .ipynb');
}

// ═══════════════════════════════════════════════════════
//  TOAST
// ═══════════════════════════════════════════════════════
let _toastTimer;
function showToast(msg, type='ok') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show' + (type!=='ok'?' '+type:'');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(()=>el.className='', 3200);
}

// ═══════════════════════════════════════════════════════
//  GOOGLE DRIVE
// ═══════════════════════════════════════════════════════
let driveClientId='', driveToken=null, driveTokenExpiry=0;
let driveFolderId=null, driveFolderName='VOID-Notebooks', driveSignedIn=false;
let tokenClient=null;

const DRIVE_API='https://www.googleapis.com/drive/v3';
const UPLOAD_API='https://www.googleapis.com/upload/drive/v3';

(function(){
  driveClientId = localStorage.getItem('void_drive_clientid')||'';
  if (driveClientId) {
    document.getElementById('drive-clientid-input').value=driveClientId;
    showDriveAuthArea();
  }
})();

function showDriveAuthArea(){
  document.getElementById('drive-clientid-wrap').style.display='none';
  document.getElementById('drive-auth-area').style.display='block';
}
function driveSetClientId(){
  const v=document.getElementById('drive-clientid-input').value.trim();
  if(!v){showToast('Paste your OAuth Client ID first','warn');return;}
  driveClientId=v; localStorage.setItem('void_drive_clientid',v);
  showDriveAuthArea(); showToast('Client ID saved — sign in now');
}
function ensureTokenClient(){
  if(tokenClient)return;
  if(!window.google?.accounts?.oauth2){showToast('Google not loaded yet','warn');return;}
  tokenClient=google.accounts.oauth2.initTokenClient({
    client_id:driveClientId,
    scope:'https://www.googleapis.com/auth/drive.file',
    callback:onTokenResponse
  });
}
function onTokenResponse(resp){
  if(resp.error){showToast('Auth failed: '+resp.error,'err');return;}
  driveToken=resp.access_token;
  driveTokenExpiry=Date.now()+(resp.expires_in-60)*1000;
  driveSignedIn=true;
  const btn=document.getElementById('drive-signin-btn');
  btn.textContent='✓ Connected to Google'; btn.classList.add('ok');
  ['btn-save','btn-list'].forEach(id=>document.getElementById(id).disabled=false);
  fetch('https://www.googleapis.com/oauth2/v3/userinfo',{headers:{Authorization:'Bearer '+driveToken}})
    .then(r=>r.json()).then(u=>document.getElementById('drive-user-info').textContent=u.email||'');
  showToast('✓ Connected to Google Drive');
  ensureDriveFolder();
}
function driveSignIn(){
  if(!driveClientId){showToast('Set Client ID first','warn');return;}
  ensureTokenClient(); if(!tokenClient)return;
  tokenClient.requestAccessToken({prompt:driveSignedIn?'':'consent'});
}
async function ensureToken(){
  if(driveToken&&Date.now()<driveTokenExpiry)return true;
  return new Promise(res=>{
    ensureTokenClient();
    const old=tokenClient.callback;
    tokenClient.callback=resp=>{old(resp);res(!resp.error);};
    tokenClient.requestAccessToken({prompt:''});
  });
}
async function driveGet(path,params=''){
  await ensureToken();
  const r=await fetch(DRIVE_API+path+(params?'?'+params:''),{headers:{Authorization:'Bearer '+driveToken}});
  if(!r.ok)throw new Error('Drive '+r.status);
  return r.json();
}
async function driveUpload(meta,content,fileId=null){
  await ensureToken();
  const boundary='void_nb_'+Date.now();
  const body=`--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(meta)}\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n${content}\r\n--${boundary}--`;
  const method=fileId?'PATCH':'POST';
  const url=(fileId?`${UPLOAD_API}/files/${fileId}`:`${UPLOAD_API}/files`)+'?uploadType=multipart&fields=id,name';
  const r=await fetch(url,{method,headers:{Authorization:'Bearer '+driveToken,'Content-Type':`multipart/related; boundary=${boundary}`},body});
  if(!r.ok)throw new Error('Upload '+r.status+': '+await r.text());
  return r.json();
}
async function ensureDriveFolder(){
  try{
    const q=encodeURIComponent(`name='${driveFolderName}' and mimeType='application/vnd.google-apps.folder' and trashed=false`);
    const res=await driveGet('/files','q='+q+'&fields=files(id,name)');
    if(res.files?.length){driveFolderId=res.files[0].id;}
    else{
      await ensureToken();
      const r=await fetch(`${DRIVE_API}/files?fields=id`,{method:'POST',headers:{Authorization:'Bearer '+driveToken,'Content-Type':'application/json'},body:JSON.stringify({name:driveFolderName,mimeType:'application/vnd.google-apps.folder'})});
      driveFolderId=(await r.json()).id;
    }
    document.getElementById('drive-folder-name').textContent=driveFolderName;
    driveListFiles();
  }catch(e){showToast('Drive folder error','err');}
}
let _nbDriveId=null;
async function driveSaveNotebook(){
  if(!driveSignedIn){showToast('Sign in first','warn');return;}
  setKernel('busy','SAVING');
  try{
    const name=(document.getElementById('nb-name-input').value||'notebook')+'.ipynb';
    const nb={nbformat:4,nbformat_minor:5,metadata:{},cells:cells.map(c=>({cell_type:c.type==='markdown'?'markdown':'code',source:c.source,metadata:{},outputs:c.outputs,execution_count:c.execCount}))};
    const meta={name,parents:driveFolderId?[driveFolderId]:[]};
    const res=await driveUpload(meta,JSON.stringify(nb,null,2),_nbDriveId);
    _nbDriveId=res.id;
    showToast('☁ Notebook saved to Drive');
    driveListFiles();
  }catch(e){showToast('Save failed: '+e.message,'err');}
  setKernel('','IDLE');
}
async function driveListFiles(){
  if(!driveSignedIn||!driveFolderId)return;
  try{
    const q=encodeURIComponent(`'${driveFolderId}' in parents and trashed=false`);
    const res=await driveGet('/files','q='+q+'&fields=files(id,name)&orderBy=name');
    const tree=document.getElementById('drive-tree');tree.innerHTML='';
    (res.files||[]).forEach(f=>{
      const d=document.createElement('div');d.className='drive-file';
      d.onclick=()=>driveOpenNotebook(f.id,f.name);
      d.innerHTML=`<span>📓</span><span class="df-name">${f.name}</span><span style="font-size:9px;color:var(--text3);">↓</span>`;
      tree.appendChild(d);
    });
  }catch(e){console.error(e);}
}
async function driveOpenNotebook(fileId,fileName){
  try{
    await ensureToken();
    const r=await fetch(`${DRIVE_API}/files/${fileId}?alt=media`,{headers:{Authorization:'Bearer '+driveToken}});
    const nb=await r.json();
    cells=[];
    (nb.cells||[]).forEach(c=>{
      const cell=makeCell(c.cell_type==='markdown'?'markdown':'code', Array.isArray(c.source)?c.source.join(''):c.source||'');
      cell.execCount=c.execution_count||null;
      cell.outputs=(c.outputs||[]).map(o=>({type:o.output_type==='stream'?o.name:'result',text:Array.isArray(o.text)?o.text.join(''):String(o.text||'')}));
      cells.push(cell);
    });
    _nbDriveId=fileId;
    document.getElementById('nb-name-input').value=fileName.replace('.ipynb','');
    renderNotebook();
    showToast('☁ Opened: '+fileName);
  }catch(e){showToast('Open failed','err');}
}
function driveSync(){
  if(!driveSignedIn){driveClientId?driveSignIn():showToast('Set OAuth Client ID in sidebar','warn');return;}
  driveSaveNotebook();
}

//  KEYBOARD SHORTCUTS
// ═══════════════════════════════════════════════════════
document.addEventListener('keydown', e => {
  if ((e.ctrlKey||e.metaKey) && e.shiftKey && e.key==='Enter') { e.preventDefault(); runAll(); }
  if ((e.ctrlKey||e.metaKey) && e.key==='Enter') { e.preventDefault(); runSelectedCell(); }
  if ((e.ctrlKey||e.metaKey) && e.key==='s') { e.preventDefault(); driveSync(); }
  if ((e.ctrlKey||e.metaKey) && e.key==='b') { e.preventDefault(); addCell('code'); }
  if ((e.ctrlKey||e.metaKey) && e.key==='m') { e.preventDefault(); addCell('markdown'); }
});

function buildStarterNotebook() {
  cells = [
    makeCell('markdown', `# VOID Notebook\n\nWelcome to **VOID Notebook** — a Jupyter-style Python notebook with a hacker terminal aesthetic.\n\n- **Shift+Enter** — run cell and add next\n- **Ctrl+Enter** — run cell in place\n- **Ctrl+Shift+Enter** — run all cells\n- **Ctrl+B** / **Ctrl+M** — add Code / Markdown cell\n- Double-click markdown cells to edit`),
    makeCell('code', `import sys
print(f"Python {sys.version}")
print("VOID Notebook kernel ready.")
print()

# Variables persist across all cells
x = 42
greeting = "Hello from VOID!"
print(greeting)`),
    makeCell('markdown', `## Deep Learning\n\nInstall packages using the **sidebar** → type a package name and click ↓\n\nWorks with: \`numpy\`, \`scipy\`, \`scikit-learn\`, \`pandas\`, \`pyspark\`, \`sympy\`, and more.`),
    makeCell('code', `# NumPy neural network — install numpy first
# Then run this cell with Ctrl+Enter

import numpy as np
np.random.seed(42)

def relu(z): return np.maximum(0, z)
def softmax(z):
    e = np.exp(z - z.max(axis=1, keepdims=True))
    return e / e.sum(axis=1, keepdims=True)

# Layer sizes: 4 inputs → 8 hidden → 3 outputs
W1 = np.random.randn(4, 8) * 0.1
b1 = np.zeros(8)
W2 = np.random.randn(8, 3) * 0.1
b2 = np.zeros(3)

X = np.random.randn(5, 4)
h = relu(X @ W1 + b1)
out = softmax(h @ W2 + b2)

print("Input shape: ", X.shape)
print("Output shape:", out.shape)
print("Predictions:\\n", out.round(3))`),
    makeCell('markdown', `## PySpark\n\nType \`pyspark\` in Packages → ↓ to install.\nThen use the cell below to run a Spark job in local mode.`),
    makeCell('code', `# PySpark — install pyspark from the sidebar first
# from pyspark.sql import SparkSession
# from pyspark.sql.functions import col, avg, desc
#
# spark = SparkSession.builder.master("local[2]").appName("VOID").getOrCreate()
# spark.sparkContext.setLogLevel("ERROR")
#
# data = [("Alice","Eng",95000),("Bob","Eng",88000),("Carol","DS",105000)]
# df = spark.createDataFrame(data, ["name","dept","salary"])
# df.groupBy("dept").agg(avg("salary").alias("avg")).orderBy(desc("avg")).show()
# spark.stop()
print("Uncomment above after installing pyspark")`),
    makeCell('code', `# Try some math
import math

for i in range(1, 6):
    print(f"  {i}! = {math.factorial(i):>6}   √{i} = {math.sqrt(i):.4f}")`),
  ];
  renderNotebook();
  if (cells.length) selectCell(cells[0].id);
}
